<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Milepost — planner</title>
<!--
  The desktop planner. A SECOND VIEW over the same engine, not a second app.

  index.html is for the road: one hand, in a moving car, no signal. This is for
  the table: deciding which of ~100 stops are in, what time you reach each one,
  and whether it is open when you get there.

  It imports store.js, so it reads and writes the SAME plan as the phone and
  syncs through the same Firestore document. Tick a stop here, it is ticked in
  the car. That shared store is the contract between the two views — change its
  shape carelessly and the two stop agreeing.

  No build step, same as the rest of the app.
-->
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/desk.css">
</head>
<body>
<header class="bar">
  <div class="brand">Milepost <span>planner</span></div>
  <label>Leg <select id="leg"></select></label>
  <label>Road <select id="road"></select></label>
  <label>Leave <input type="date" id="date" value="2026-12-19"></label>
  <label>at <input type="time" id="at" value="06:00"></label>
  <div class="totals" id="totals"></div>
</header>

<main>
  <section class="pane list">
    <div class="paneHead">
      <h2>Stops</h2>
      <div class="filters">
        <button data-kind="all" class="on">All</button>
        <button data-kind="sight">Sights</button>
        <button data-kind="food">Eateries</button>
        <span class="hint">click to add or drop</span>
      </div>
    </div>
    <div id="pool"></div>
  </section>

  <section class="pane plan">
    <div class="paneHead">
      <h2>The day, hour by hour</h2>
      <div id="warn"></div>
    </div>
    <!-- Saved plans. A plan belongs to a road, so this list changes when the
         road above does: "the same stops on a different route" is not the same
         list, because which stops exist depends on which way you go. -->
    <div class="planbar">
      <label>Plan <select id="plan"></select></label>
      <span class="dirty" id="dirty"></span>
      <span class="spacer"></span>
      <button id="psave" title="Overwrite the plan now loaded">save</button>
      <button id="pnew" title="Keep this one and start another under a new name">save as new</button>
      <button id="prename">rename</button>
      <button id="pdel">delete</button>
      <span class="sep"></span>
      <button id="pcopy" title="Markdown on the clipboard, ready to paste">copy</button>
      <button id="pdown" title="Download it as a .md file">download</button>
    </div>
    <div id="itin"></div>
  </section>
</main>

<script type="module" src="js/desk.js"></script>
</body>
</html>
