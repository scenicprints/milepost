<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EFEEEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1B1B19" media="(prefers-color-scheme: dark)">
<title>Milepost</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!-- iOS ignores the manifest for home-screen behaviour; these are what make
     it open full screen instead of in a Safari tab. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Milepost">
<meta name="mobile-web-app-capable" content="yes">
<!-- Vendored, not linked. The service worker ignores cross-origin requests,
     so a Google-hosted font is a font you do not have in the Mojave. -->
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="shell">
  <div class="head" id="head"></div>
  <div class="scroll" id="scroll"></div>
  <nav class="tabs" id="tabs"></nav>
  <div class="sheet" id="sheet"></div>
  <div id="install"></div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
